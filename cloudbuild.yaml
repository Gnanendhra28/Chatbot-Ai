steps:
  # 1. Build Backend Docker Container Image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/enterprise-rag-backend:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/enterprise-rag-backend:latest'
      - './backend'

  # 2. Push Backend Image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/enterprise-rag-backend:$COMMIT_SHA'

  # 3. Deploy Backend to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'enterprise-rag-backend'
      - '--image=gcr.io/$PROJECT_ID/enterprise-rag-backend:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--set-env-vars=STORAGE_TYPE=gcs,LLM_PROVIDER=groq,LLM_MODEL=qwen/qwen3.8-27b'

  # 4. Build Frontend Docker Container Image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/enterprise-rag-frontend:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/enterprise-rag-frontend:latest'
      - './frontend'

  # 5. Push Frontend Image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/enterprise-rag-frontend:$COMMIT_SHA'

  # 6. Deploy Frontend to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'enterprise-rag-frontend'
      - '--image=gcr.io/$PROJECT_ID/enterprise-rag-frontend:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'

images:
  - 'gcr.io/$PROJECT_ID/enterprise-rag-backend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/enterprise-rag-backend:latest'
  - 'gcr.io/$PROJECT_ID/enterprise-rag-frontend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/enterprise-rag-frontend:latest'
